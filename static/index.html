<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KinApp - AI Nutrition & Workout</title>

  <script>
    // Authentication bootstrap: every same-origin API call carries the session token.
    const kinappToken = localStorage.getItem('kinapp_access_token');
    const kinappUser = localStorage.getItem('kinapp_username');
    if (!kinappToken || !kinappUser) {
      window.location.replace('/static/login.html');
    } else {
      const originalFetch = window.fetch.bind(window);
      window.fetch = async (input, init = {}) => {
        const url = typeof input === 'string' ? input : input.url;
        const target = new URL(url, window.location.origin);
        const headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
        if (target.origin === window.location.origin) {
          headers.set('Authorization', `Bearer ${kinappToken}`);
        }
        const response = await originalFetch(input, { ...init, headers });
        if (response.status === 401) {
          localStorage.removeItem('kinapp_access_token');
          localStorage.removeItem('kinapp_username');
          window.location.replace('/static/login.html');
        }
        return response;
      };
    }
  </script>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet" />

  <!-- React & Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: '#121212',
            glass: 'rgba(255, 255, 255, 0.08)',
            neon: '#affc41',
            alert: '#ff0055',
            primary: '#affc41',
            secondary: '#b3b3b3'
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
          },
          backdropBlur: {
            xs: '2px',
          }
        }
      }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #121212;
      background-image: radial-gradient(circle at 10% 20%, rgba(175, 252, 65, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 0, 85, 0.05) 0%, transparent 40%);
      color: white;
      padding-bottom: 90px;
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Glassmorphism Utilities */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .glass-nav {
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }

    .active-tab {
      color: #affc41;
    }

    .active-tab span {
      font-variation-settings: 'FILL' 1;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // --- Mock constants for dev ---
    const API_BASE = '/api'; // In real app, empty string if same origin

    // --- Components ---

    // 1. Navigation
    const NavBar = ({ activeTab, setTab }) => {
      const tabs = [
        { id: 'dashboard', icon: 'monitoring', label: 'Home' },
        { id: 'record', icon: 'restaurant', label: 'Meals' },
        { id: 'workout', icon: 'fitness_center', label: 'Workout' },
        { id: 'friends', icon: 'groups', label: 'Friends' },
        { id: 'settings', icon: 'settings', label: 'Settings' },
      ];

      return (
        <nav className="glass-nav fixed bottom-0 w-full pb-safe pt-2 px-4 z-50">
          <div className="flex justify-between items-center max-w-md mx-auto h-16">
            {tabs.map(tab => (
              <button
                key={tab.id}
                onClick={() => setTab(tab.id)}
                className={`flex flex-col items-center justify-center w-full h-full transition-all duration-300 ${activeTab === tab.id ? 'active-tab scale-110' : 'text-gray-500 hover:text-gray-300'}`}
              >
                <span className="material-symbols-outlined text-2xl mb-1">{tab.icon}</span>
                <span className="text-[10px] font-medium tracking-wide">{tab.label}</span>
              </button>
            ))}
          </div>
        </nav>
      );
    };
    // Global User State (Simple context replacement)
    const UserContext = React.createContext(null);

    // 2. Dashboard View with Real Data
    const Dashboard = () => {
      const { currentUser, setShowNotifs, settingsVersion } = React.useContext(UserContext);
      const [meals, setMeals] = useState([]);
      const [targets, setTargets] = useState({ cal: 2000, p: 60, f: 60, c: 300, salt: 7.0, fiber: 20.0 });
      const [today, setToday] = useState(new Date().toISOString().split('T')[0]);
      const [score, setScore] = useState(0);
      const [unreadCount, setUnreadCount] = useState(0);
      const [workoutSummary, setWorkoutSummary] = useState(null);
      const chartRef = useRef(null);
      const canvasRef = useRef(null);

      // Fetch Data
      useEffect(() => {
        const fetchData = async () => {
          try {
            // 1. Get Targets
            const userRes = await fetch(`/users/me?current_user=${encodeURIComponent(currentUser)}`);
            if (userRes.ok) {
              const userData = await userRes.json();
              if (userData.target_calories) {
                setTargets({
                  cal: userData.target_calories,
                  p: userData.target_protein,
                  f: userData.target_fat,
                  c: userData.target_carbs,
                  salt: userData.target_salt || 7.0,
                  fiber: userData.target_fiber || 20.0
                });
              }
            }

            // 2. Get Meals
            const mealsRes = await fetch(`/meals?user_id=${encodeURIComponent(currentUser)}&date=${today}`);
            if (mealsRes.ok) {
              setMeals(await mealsRes.json());
            }

            // 3. Get Unread Notifs
            const notifRes = await fetch(`/notifications?current_user=${encodeURIComponent(currentUser)}`);
            if (notifRes.ok) {
              const notifs = await notifRes.json();
              setUnreadCount(notifs.filter(n => !n.is_read).length);
            }

            // 4. Get Workout Summary
            const workoutRes = await fetch(`/api/workout/today-summary?user_id=${encodeURIComponent(currentUser)}&date=${today}`);
            if (workoutRes.ok) {
              const workoutData = await workoutRes.json();
              setWorkoutSummary(workoutData);
            }
          } catch (e) {
            console.error("Fetch error:", e);
          }
        };
        fetchData();
      }, [currentUser, today, settingsVersion]);


      // Calculate Totals & Score
      const totals = useMemo(() => {
        const t = { cal: 0, p: 0, f: 0, c: 0, salt: 0, fiber: 0 };
        meals.forEach(m => {
          t.cal += m.calories;
          t.p += m.protein;
          t.f += m.fat;
          t.c += m.carbs;
          t.salt += (m.salt || 0);
          t.fiber += (m.fiber || 0);
        });
        return t;
      }, [meals]);

      // Update Chart & Advice
      useEffect(() => {
        // Score Calc
        const pRate = (totals.p / targets.p) * 100;
        const fRate = (totals.f / targets.f) * 100;
        const cRate = (totals.c / targets.c) * 100;
        const diff = (Math.abs(100 - pRate) + Math.abs(100 - fRate) + Math.abs(100 - cRate)) / 3;
        let s = Math.max(0, 100 - diff);
        if (totals.cal === 0) s = 0;
        setScore(Math.floor(s));

        // Chart
        if (canvasRef.current) {
          if (chartRef.current) chartRef.current.destroy();
          chartRef.current = new Chart(canvasRef.current, {
            type: 'radar',
            data: {
              labels: ['Protein', 'Fat', 'Carbs'],
              datasets: [{
                label: 'Achievement (%)',
                data: [pRate, fRate, cRate],
                backgroundColor: 'rgba(175, 252, 65, 0.2)',
                borderColor: '#affc41',
                pointBackgroundColor: '#affc41',
                borderWidth: 2
              }]
            },
            options: {
              scales: {
                r: {
                  angleLines: { color: 'rgba(255,255,255,0.1)' },
                  grid: { color: 'rgba(255,255,255,0.1)' },
                  pointLabels: { color: '#ccc', font: { size: 10 } },
                  suggestedMin: 0,
                  suggestedMax: 100,
                  ticks: { display: false }
                }
              },
              plugins: { legend: { display: false } },
              maintainAspectRatio: false
            }
          });
        }
      }, [totals, targets]);

      const getBalanceStatus = (current, target) => {
        const ratio = (current / target) * 100;
        if (ratio < 80) return { label: 'Low', color: 'text-yellow-400' };
        if (ratio > 120) return { label: 'High', color: 'text-alert' };
        return { label: 'Good', color: 'text-neon' };
      };

      return (
        <div className="p-4 space-y-6 max-w-md mx-auto animate-fade-in pb-24">
          <header className="flex justify-between items-center mb-2">
            <div>
              <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-neon to-emerald-400">
                Today's Summary
              </h1>
              <input
                type="date"
                value={today}
                onChange={(e) => setToday(e.target.value)}
                className="bg-transparent text-gray-400 text-xs border-none outline-none"
              />
            </div>
            <div className="flex items-center space-x-3">
              <button onClick={() => setShowNotifs(true)} className="relative p-2 rounded-full bg-glass border border-white/10">
                <span className="material-symbols-outlined text-white text-xl">notifications</span>
                {unreadCount > 0 && (
                  <span className="absolute top-0 right-0 w-3 h-3 bg-alert rounded-full border border-black"></span>
                )}
              </button>
              <div className="w-10 h-10 rounded-full bg-glass flex items-center justify-center border border-white/10">
                <span className="material-symbols-outlined text-neon">account_circle</span>
              </div>
            </div>
          </header>

          {/* Score Card */}
          <div className="glass-card p-6 relative overflow-hidden group">
            <div className="absolute top-0 right-0 w-24 h-24 bg-neon/10 rounded-full blur-2xl -mr-10 -mt-10 transition-all duration-700 group-hover:bg-neon/20"></div>
            <div className="relative z-10 flex justify-between items-end">
              <div>
                <p className="text-gray-400 text-sm font-medium mb-1">Nutrition Score</p>
                <div className="text-5xl font-black text-white tracking-tighter">
                  {score}<span className="text-xl text-gray-500 font-normal ml-1">pts</span>
                </div>
              </div>
              <div className="w-24 h-24 absolute right-0 bottom-[-10px]">
                <canvas ref={canvasRef}></canvas>
              </div>
            </div>
          </div>

          {/* Calorie Bar */}
          <div className="glass-card p-5 space-y-2">
            <div className="flex justify-between text-sm">
              <span className="text-gray-300">Calories</span>
              <span className="text-neon font-bold">{totals.cal} / {targets.cal}</span>
            </div>
            <div className="h-2 bg-gray-800 rounded-full overflow-hidden">
              <div
                className="h-full bg-neon shadow-[0_0_10px_rgba(175,252,65,0.5)] transition-all duration-1000"
                style={{ width: `${Math.min((totals.cal / targets.cal) * 100, 100)}%` }}
              ></div>
            </div>
          </div>

          {/* Balance Table */}
          {totals.cal > 0 && (
            <div className="glass-card p-4 overflow-hidden">
              <h3 className="text-sm text-gray-400 mb-3 border-b border-white/10 pb-2">Nutritional Balance</h3>
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-gray-500 text-xs">
                    <th className="text-left pb-2">Nutrient</th>
                    <th className="text-right pb-2">Target</th>
                    <th className="text-right pb-2">Actual</th>
                    <th className="text-right pb-2">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-white/5">
                  {[
                    { l: 'Protein', t: targets.p, a: totals.p, u: 'g' },
                    { l: 'Fat', t: targets.f, a: totals.f, u: 'g' },
                    { l: 'Carbs', t: targets.c, a: totals.c, u: 'g' },
                    { l: 'Salt', t: targets.salt, a: totals.salt, u: 'g' },
                    { l: 'Fiber', t: targets.fiber, a: totals.fiber, u: 'g' },
                  ].map((row, i) => {
                    const stat = getBalanceStatus(row.a, row.t);
                    return (
                      <tr key={i}>
                        <td className="py-2 text-gray-300">{row.l}</td>
                        <td className="py-2 text-right text-gray-500">{row.t}</td>
                        <td className="py-2 text-right font-medium">{row.a.toFixed(1)}</td>
                        <td className={`py-2 text-right font-bold ${stat.color}`}>{stat.label}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {/* Workout Summary */}
          {workoutSummary && workoutSummary.highlight && (
            <div className="space-y-3">
              <h3 className="text-sm text-gray-400 pl-1 flex items-center">
                <span className="material-symbols-outlined text-neon mr-2 text-base">fitness_center</span>
                Today's Workout
              </h3>

              {/* Highlight */}
              <div className="glass-card p-5 relative overflow-hidden group border-l-4 border-l-neon">
                <div className="absolute top-0 right-0 w-32 h-32 bg-neon/10 rounded-full blur-3xl -mr-16 -mt-16"></div>
                <div className="relative z-10">
                  <div className="flex justify-between items-start mb-3">
                    <div>
                      <p className="text-xs text-gray-400 mb-1">🏆 Best Lift Today</p>
                      <h4 className="text-xl font-bold text-white">{workoutSummary.highlight.exercise_name}</h4>
                    </div>
                    {workoutSummary.highlight.previous_comparison && (
                      <span className={`text-xs px-2 py-1 rounded border ${workoutSummary.highlight.previous_comparison.startsWith('+')
                        ? 'text-neon border-neon/30 bg-neon/10'
                        : 'text-gray-400 border-gray-600'
                        }`}>
                        {workoutSummary.highlight.previous_comparison}
                      </span>
                    )}
                  </div>
                  <div className="flex items-end gap-4">
                    <div>
                      <p className="text-xs text-gray-500">Best Set</p>
                      <p className="text-lg font-bold text-white">
                        {workoutSummary.highlight.best_set.weight}kg × {workoutSummary.highlight.best_set.reps}
                      </p>
                    </div>
                    <div>
                      <p className="text-xs text-gray-500">Est. 1RM</p>
                      <p className="text-2xl font-black text-neon">{workoutSummary.highlight.best_set.estimated_1rm.toFixed(1)}kg</p>
                    </div>
                  </div>
                </div>
              </div>

              {/* Total Volume */}
              {workoutSummary.total_volume > 0 && (
                <div className="glass-card p-4 flex justify-between items-center">
                  <div>
                    <p className="text-xs text-gray-400 mb-1">Total Volume</p>
                    <p className="text-2xl font-bold text-white">{workoutSummary.total_volume.toFixed(0)}kg</p>
                  </div>
                  {workoutSummary.total_volume_change !== null && (
                    <div className={`text-right ${workoutSummary.total_volume_change > 0 ? 'text-neon' : 'text-gray-400'
                      }`}>
                      <p className="text-xs text-gray-500">vs. Last</p>
                      <p className="text-lg font-bold">
                        {workoutSummary.total_volume_change > 0 ? '+' : ''}
                        {workoutSummary.total_volume_change}%
                      </p>
                    </div>
                  )}
                </div>
              )}

              {/* Exercise Cards */}
              {workoutSummary.workouts && workoutSummary.workouts.length > 1 && (
                <div className="grid grid-cols-2 gap-2">
                  {workoutSummary.workouts.slice(0, 4).map((w, idx) => (
                    <div key={idx} className="glass-card p-3">
                      <div className="flex items-start justify-between mb-1">
                        <p className="text-xs font-bold text-white truncate pr-1">{w.exercise_name}</p>
                        {w.exercise_memo && <span className="text-xs">📝</span>}
                      </div>
                      <p className="text-xs text-gray-400">{w.best_set.weight}kg × {w.best_set.reps}</p>
                      <div className="flex justify-between items-center mt-1">
                        <span className="text-xs text-neon">1RM: {w.best_set.estimated_1rm.toFixed(1)}kg</span>
                        {w.previous_comparison && (
                          <span className={`text-[10px] ${w.previous_comparison.startsWith('+') ? 'text-neon' : 'text-gray-500'
                            }`}>
                            {w.previous_comparison}
                          </span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Meal List Mockup (To be implemented later properly) */}
          <div className="space-y-3">
            <h3 className="text-sm text-gray-400 pl-1">Meals</h3>
            {meals.map(m => (
              <div key={m.id} className="glass-card p-4 flex justify-between items-center">
                <div>
                  <span className="text-xs text-neon border border-neon/30 px-2 py-0.5 rounded mr-2">{m.meal_type}</span>
                  <span className="font-bold text-sm">{m.food_name}</span>
                  <div className="text-xs text-gray-400 mt-1">
                    {m.calories}kcal (P:{m.protein} F:{m.fat} C:{m.carbs})
                  </div>
                </div>
                <button className="text-gray-500 hover:text-alert">
                  <span className="material-symbols-outlined text-sm">delete</span>
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // 3. Record View
    const Record = () => {
      const { currentUser } = React.useContext(UserContext);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [estimation, setEstimation] = useState(null);
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [mealType, setMealType] = useState('Dinner');

      // Form State for Nutrients
      const [form, setForm] = useState({
        name: '', cal: '', p: '', f: '', c: '', salt: '', fiber: ''
      });

      // AI Estimate
      const handleAnalyze = async () => {
        if (!input) return;
        setLoading(true);
        setEstimation(null); // Reset previous
        try {
          const res = await fetch('/api/estimate_nutrition', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: input })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Estimation Failed");

          // Populate Form
          setForm({
            name: data.food_name || input,
            cal: data.calories || 0,
            p: data.protein || 0,
            f: data.fat || 0,
            c: data.carbs || 0,
            salt: data.salt || 0,
            fiber: data.fiber || 0
          });
          setEstimation(data);
        } catch (e) {
          alert("Error: " + e.message);
        } finally {
          setLoading(false);
        }
      };

      // Save Meal
      const handleSave = async () => {
        const body = {
          user_id: currentUser,
          date: date,
          meal_type: mealType,
          food_name: form.name,
          calories: parseInt(form.cal) || 0,
          protein: parseFloat(form.p) || 0,
          fat: parseFloat(form.f) || 0,
          carbs: parseFloat(form.c) || 0,
          salt: parseFloat(form.salt) || 0,
          fiber: parseFloat(form.fiber) || 0
        };

        try {
          const res = await fetch('/meals', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          if (res.ok) {
            alert("Meal Saved!");
            setInput('');
            setEstimation(null);
            setForm({ name: '', cal: '', p: '', f: '', c: '', salt: '', fiber: '' });
          } else {
            alert("Error saving meal");
          }
        } catch (e) {
          console.error(e);
        }
      };

      // Helpers for Input Change
      const handleChange = (f, val) => setForm(prev => ({ ...prev, [f]: val }));

      return (
        <div className="p-4 max-w-md mx-auto animate-fade-in pb-24">
          <header className="flex justify-between items-center mb-6">
            <h2 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-neon to-emerald-400">Record Meal</h2>
            <input
              type="date"
              value={date}
              onChange={(e) => setDate(e.target.value)}
              className="bg-glass text-white text-xs px-2 py-1 rounded border border-white/10 outline-none"
            />
          </header>

          {/* Input Area */}
          <div className="glass-card p-1 mb-6 relative group focus-within:ring-1 ring-neon/50 transition-all">
            <div className="absolute top-2 right-2 z-10">
              <select
                value={mealType}
                onChange={(e) => setMealType(e.target.value)}
                className="bg-black/50 text-white text-xs px-2 py-1 rounded outline-none border border-white/20"
              >
                <option>Breakfast</option>
                <option>Lunch</option>
                <option>Dinner</option>
                <option>Snack</option>
              </select>
            </div>
            <textarea
              value={input}
              onChange={(e) => setInput(e.target.value)}
              placeholder="Describe your meal... (e.g. 'Beef bowl with egg')"
              className="w-full bg-transparent text-white p-4 pt-10 h-32 outline-none resize-none placeholder-gray-600 text-base"
            ></textarea>
            <button
              onClick={handleAnalyze}
              disabled={loading || !input}
              className="absolute bottom-3 right-3 bg-neon text-black font-bold py-2 px-4 rounded-full flex items-center shadow-lg hover:shadow-neon/50 transition-all disabled:opacity-50 disabled:cursor-not-allowed hover:scale-105 active:scale-95"
            >
              {loading ? (
                <span className="material-symbols-outlined animate-spin text-sm">progress_activity</span>
              ) : (
                <>
                  <span className="material-symbols-outlined text-sm mr-1">auto_awesome</span>
                  Analyze
                </>
              )}
            </button>
          </div>

          {/* Estimation Result Form */}
          {(estimation || form.name) && (
            <div className="glass-card p-5 animate-fade-in border-t-2 border-neon">
              <div className="flex justify-between items-start mb-4">
                <h3 className="font-bold text-lg flex items-center">
                  <span className="material-symbols-outlined mr-2 text-neon">restaurant</span>
                  Nutrition Facts
                </h3>
                {estimation && <span className="text-[10px] text-gray-400 border border-gray-700 px-2 py-1 rounded bg-black/30">AI Source: {estimation.source}</span>}
              </div>

              <div className="space-y-3">
                <div>
                  <label className="text-xs text-gray-500 block mb-1">Food Name</label>
                  <input
                    type="text"
                    value={form.name}
                    onChange={(e) => handleChange('name', e.target.value)}
                    className="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-sm text-white focus:border-neon outline-none transition-colors"
                  />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  {[
                    { l: 'Calories (kcal)', f: 'cal' },
                    { l: 'Protein (g)', f: 'p' },
                    { l: 'Fat (g)', f: 'f' },
                    { l: 'Carbs (g)', f: 'c' },
                    { l: 'Salt (g)', f: 'salt' },
                    { l: 'Fiber (g)', f: 'fiber' },
                  ].map((field) => (
                    <div key={field.f}>
                      <label className="text-xs text-gray-500 block mb-1">{field.l}</label>
                      <input
                        type="number"
                        value={form[field.f]}
                        onChange={(e) => handleChange(field.f, e.target.value)}
                        className="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-sm text-white focus:border-neon outline-none transition-colors"
                      />
                    </div>
                  ))}
                </div>
              </div>

              {/* AI Advice */}
              {estimation && estimation.advice && (
                <div className="mt-4 p-3 bg-neon/5 border-l-2 border-neon text-xs text-gray-300 rounded-r">
                  <p className="font-bold text-neon mb-1">💡 Dietitian's Advice</p>
                  {estimation.advice}
                </div>
              )}

              <button
                onClick={handleSave}
                className="w-full mt-6 bg-gradient-to-r from-neon to-emerald-400 text-black font-bold py-3 rounded-xl shadow-lg hover:shadow-neon/20 transition-all hover:scale-[1.02] active:scale-[0.98]"
              >
                Save Meal
              </button>
            </div>
          )}
        </div>
      );
    };

    // 4. Workout View (Record, History, Progress, Coach)
    const Workout = () => {
      const { currentUser } = React.useContext(UserContext);
      const [activeTab, setActiveTab] = useState('record');

      // Record State
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [session, setSession] = useState(null);
      const [exercises, setExercises] = useState([]);
      const [sessionMemo, setSessionMemo] = useState('');
      const [exerciseName, setExerciseName] = useState('');
      const [exerciseMemo, setExerciseMemo] = useState('');
      const [sets, setSets] = useState([{ weight: '', reps: '' }]);
      const [showAddExercise, setShowAddExercise] = useState(false);

      // History State
      const [history, setHistory] = useState([]);
      const [bodyPartFilter, setBodyPartFilter] = useState('All');
      const [historySearch, setHistorySearch] = useState('');
      const [historyLimit, setHistoryLimit] = useState(20);

      // Progress State
      const [exerciseList, setExerciseList] = useState([]);
      const [selectedExercise, setSelectedExercise] = useState('');
      const [progressData, setProgressData] = useState([]);
      const progressChartRef = useRef(null);
      const progressCanvasRef = useRef(null);

      // Coach State
      const [coachLoading, setCoachLoading] = useState(false);
      const [coachResult, setCoachResult] = useState(null);
      const [coachExercise, setCoachExercise] = useState('');

      // Achievements State
      const [achievements, setAchievements] = useState(null);

      // Load session for today
      useEffect(() => {
        if (activeTab !== 'record') return;
        const loadSession = async () => {
          try {
            const res = await fetch(`/api/workout/sessions?user_id=${encodeURIComponent(currentUser)}&date=${date}`);
            if (res.ok) {
              const sessions = await res.json();
              if (sessions.length > 0) {
                setSession(sessions[0]);
                setSessionMemo(sessions[0].session_memo || '');
                const detailRes = await fetch(`/api/workout/sessions/${sessions[0].id}`);
                if (detailRes.ok) { const detail = await detailRes.json(); setExercises(detail.exercises || []); }
              } else { setSession(null); setExercises([]); setSessionMemo(''); }
            }
          } catch (e) { console.error("Load session error:", e); }
        };
        loadSession();
      }, [currentUser, date, activeTab]);

      // Load History
      useEffect(() => {
        if (activeTab !== 'history') return;
        const loadHistory = async () => {
          try {
            const url = new URL('/api/workout/history', window.location.origin);
            url.searchParams.append('user_id', currentUser);
            if (bodyPartFilter !== 'All') url.searchParams.append('body_part', bodyPartFilter);
            if (historySearch) url.searchParams.append('exercise_name', historySearch);
            url.searchParams.append('limit', historyLimit);
            const res = await fetch(url);
            if (res.ok) setHistory(await res.json());
          } catch (e) { console.error("Load history error:", e); }
        };
        const timer = setTimeout(loadHistory, 300);
        return () => clearTimeout(timer);
      }, [currentUser, activeTab, bodyPartFilter, historySearch, historyLimit]);

      // Load exercise list for Progress
      useEffect(() => {
        if (activeTab !== 'progress') return;
        const loadExercises = async () => {
          try {
            const res = await fetch(`/api/workout/progress?user_id=${encodeURIComponent(currentUser)}`);
            if (res.ok) {
              const data = await res.json();
              setExerciseList(data.exercises || []);
              if (data.exercises?.length > 0 && !selectedExercise) setSelectedExercise(data.exercises[0].name);
            }
          } catch (e) { console.error(e); }
        };
        loadExercises();
      }, [currentUser, activeTab]);

      // Load progress data for selected exercise
      useEffect(() => {
        if (activeTab !== 'progress' || !selectedExercise) return;
        const loadProgress = async () => {
          try {
            const res = await fetch(`/api/workout/progress?user_id=${encodeURIComponent(currentUser)}&exercise_name=${encodeURIComponent(selectedExercise)}`);
            if (res.ok) { const data = await res.json(); setProgressData(data.data || []); }
          } catch (e) { console.error(e); }
        };
        loadProgress();
      }, [currentUser, activeTab, selectedExercise]);

      // Render progress chart
      useEffect(() => {
        if (!progressCanvasRef.current || progressData.length === 0) return;
        if (progressChartRef.current) progressChartRef.current.destroy();
        progressChartRef.current = new Chart(progressCanvasRef.current, {
          type: 'line',
          data: {
            labels: progressData.map(d => d.date),
            datasets: [{
              label: 'Est. 1RM (kg)',
              data: progressData.map(d => d.estimated_1rm),
              borderColor: '#affc41',
              backgroundColor: 'rgba(175, 252, 65, 0.1)',
              fill: true, tension: 0.4, pointRadius: 5,
              pointBackgroundColor: '#affc41', pointBorderColor: '#000', pointBorderWidth: 2,
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(0,0,0,0.8)', titleColor: '#affc41', bodyColor: '#fff' } },
            scales: {
              x: { ticks: { color: '#666', maxRotation: 45, font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
              y: { ticks: { color: '#666', callback: v => v + 'kg' }, grid: { color: 'rgba(255,255,255,0.05)' } }
            }
          }
        });
      }, [progressData]);

      // Load achievements
      useEffect(() => {
        if (activeTab !== 'record') return;
        const loadAchievements = async () => {
          try {
            const res = await fetch(`/api/achievements?user_id=${encodeURIComponent(currentUser)}`);
            if (res.ok) setAchievements(await res.json());
          } catch (e) { console.error(e); }
        };
        loadAchievements();
      }, [currentUser, activeTab]);

      // Session & Exercise handlers
      const createSession = async () => {
        try {
          const res = await fetch('/api/workout/sessions', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: currentUser, date, session_memo: sessionMemo })
          });
          if (res.ok) { const data = await res.json(); setSession(data); setShowAddExercise(true); }
          else { const err = await res.text(); alert('Error: ' + err); }
        } catch (e) { alert('Error: ' + e.message); }
      };

      const handleAddExercise = async () => {
        if (!exerciseName || !session) return;
        try {
          const exRes = await fetch('/api/workout/exercises', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: session.id || session.session_id, exercise_name: exerciseName, exercise_memo: exerciseMemo, sort_order: exercises.length })
          });
          if (!exRes.ok) throw new Error('Failed');
          const exData = await exRes.json();
          for (let i = 0; i < sets.length; i++) {
            const s = sets[i];
            if (s.weight && s.reps) {
              await fetch('/api/workout/sets', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ workout_exercise_id: exData.exercise_id, set_number: i + 1, weight: parseFloat(s.weight), reps: parseInt(s.reps) })
              });
            }
          }
          const detailRes = await fetch(`/api/workout/sessions/${session.id || session.session_id}`);
          if (detailRes.ok) { const detail = await detailRes.json(); setExercises(detail.exercises || []); }
          setExerciseName(''); setExerciseMemo(''); setSets([{ weight: '', reps: '' }]); setShowAddExercise(false);
        } catch (e) { alert('Error: ' + e.message); }
      };

      const updateSet = (idx, field, val) => setSets(prev => prev.map((s, i) => i === idx ? { ...s, [field]: val } : s));
      const addSet = () => setSets(prev => [...prev, { weight: '', reps: '' }]);

      // AI Coach handler
      const askCoach = async () => {
        setCoachLoading(true); setCoachResult(null);
        try {
          const url = new URL('/api/ai/coach', window.location.origin);
          url.searchParams.append('user_id', currentUser);
          if (coachExercise) url.searchParams.append('exercise_name', coachExercise);
          const res = await fetch(url, { method: 'POST' });
          if (res.ok) setCoachResult(await res.json());
          else setCoachResult({ analysis: 'Error', advice: await res.text(), program: [] });
        } catch (e) { setCoachResult({ analysis: 'Error', advice: e.message, program: [] }); }
        setCoachLoading(false);
      };

      const tabs = [
        { id: 'record', label: 'Record', icon: 'edit_note' },
        { id: 'history', label: 'History', icon: 'history' },
        { id: 'progress', label: 'Progress', icon: 'trending_up' },
        { id: 'coach', label: 'AI Coach', icon: 'psychology' },
      ];

      return (
        <div className="p-4 max-w-md mx-auto animate-fade-in pb-24">
          <header className="mb-4">
            <h2 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-neon to-emerald-400 mb-3">
              🏋️ Workout
            </h2>
            <div className="flex bg-white/10 rounded-xl p-1 gap-0.5">
              {tabs.map(t => (
                <button key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  className={`flex-1 flex flex-col items-center py-1.5 rounded-lg text-[10px] font-bold transition-all ${activeTab === t.id ? 'bg-neon text-black shadow-lg shadow-neon/20' : 'text-gray-500 hover:text-gray-300'}`}
                >
                  <span className="material-symbols-outlined text-base">{t.icon}</span>
                  {t.label}
                </button>
              ))}
            </div>
          </header>

          {/* Achievements Banner */}
          {activeTab === 'record' && achievements && achievements.earned.length > 0 && (
            <div className="glass-card p-3 mb-4 flex items-center gap-3 overflow-x-auto no-scrollbar">
              <span className="text-xs text-gray-400 whitespace-nowrap">Lv.{achievements.level}</span>
              <div className="flex gap-1">
                {achievements.all.filter(a => achievements.earned.includes(a.id)).map(a => (
                  <span key={a.id} title={a.name + ': ' + a.desc} className="text-xl cursor-help hover:scale-125 transition-transform">{a.icon}</span>
                ))}
              </div>
              <span className="text-[10px] text-purple-400 ml-auto whitespace-nowrap">{achievements.level_name}</span>
            </div>
          )}

          {/* ====== RECORD TAB ====== */}
          {activeTab === 'record' && (
            <>
              <div className="flex justify-end mb-4">
                <input type="date" value={date} onChange={(e) => setDate(e.target.value)}
                  className="bg-glass text-white text-xs px-2 py-1 rounded border border-white/10 outline-none" />
              </div>
              {!session ? (
                <div className="glass-card p-6 text-center">
                  <p className="text-gray-400 mb-4">No session for this day</p>
                  <textarea value={sessionMemo} onChange={(e) => setSessionMemo(e.target.value)}
                    placeholder="Session memo (optional)..."
                    className="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-sm text-white mb-4 outline-none resize-none h-20" />
                  <button onClick={createSession}
                    className="bg-neon text-black font-bold py-3 px-6 rounded-xl hover:scale-105 transition-transform">
                    Start Workout
                  </button>
                </div>
              ) : (
                <div className="space-y-4">
                  {session.session_memo && (
                    <div className="glass-card p-3 text-xs text-gray-300 border-l-2 border-neon">📝 {session.session_memo}</div>
                  )}
                  {exercises.map(ex => (
                    <div key={ex.id} className="glass-card p-4">
                      <div className="flex justify-between items-start mb-2">
                        <div className="flex items-center gap-2">
                          <h3 className="font-bold text-lg">{ex.exercise_name}</h3>
                          {ex.body_part && ex.body_part !== 'Other' && (
                            <span className="text-[10px] bg-white/10 px-1.5 py-0.5 rounded text-gray-400">{ex.body_part}</span>
                          )}
                        </div>
                        {ex.sets.length > 0 && (
                          <span className="text-xs text-neon border border-neon/30 px-2 py-0.5 rounded">
                            Best: {Math.max(...ex.sets.map(s => s.estimated_1rm)).toFixed(1)}kg
                          </span>
                        )}
                      </div>
                      {ex.exercise_memo && <p className="text-xs text-gray-400 mb-2">{ex.exercise_memo}</p>}
                      <div className="space-y-1">
                        {ex.sets.map((s, idx) => (
                          <div key={s.id} className="flex items-center text-sm bg-white/5 rounded px-3 py-2">
                            <span className="text-gray-500 w-12">Set {idx + 1}</span>
                            <span className="flex-1">{s.weight}kg × {s.reps}reps</span>
                            <span className="text-neon text-xs">1RM: {s.estimated_1rm}kg</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                  {!showAddExercise ? (
                    <button onClick={() => setShowAddExercise(true)}
                      className="w-full glass-card p-4 flex items-center justify-center text-neon hover:bg-neon/10 transition-colors">
                      <span className="material-symbols-outlined mr-2">add_circle</span> Add Exercise
                    </button>
                  ) : (
                    <div className="glass-card p-5 border-t-2 border-neon animate-fade-in">
                      <h4 className="font-bold mb-4 flex items-center">
                        <span className="material-symbols-outlined mr-2 text-neon">fitness_center</span> New Exercise
                      </h4>
                      <div className="space-y-3">
                        <div>
                          <label className="text-xs text-gray-500 block mb-1">Exercise Name</label>
                          <input type="text" value={exerciseName} onChange={(e) => setExerciseName(e.target.value)}
                            placeholder="e.g. Bench Press" className="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-sm text-white focus:border-neon outline-none" />
                        </div>
                        <div>
                          <label className="text-xs text-gray-500 block mb-1">Memo (optional)</label>
                          <input type="text" value={exerciseMemo} onChange={(e) => setExerciseMemo(e.target.value)}
                            placeholder="e.g. Focus on form" className="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-sm text-white focus:border-neon outline-none" />
                        </div>
                        <div>
                          <div className="flex justify-between items-center mb-2">
                            <label className="text-xs text-gray-500">Sets</label>
                            <button onClick={addSet} className="text-xs text-neon border border-neon/50 px-2 py-0.5 rounded hover:bg-neon/10">+ Add Set</button>
                          </div>
                          <div className="space-y-2">
                            {sets.map((s, idx) => (
                              <div key={idx} className="flex gap-2">
                                <span className="text-xs text-gray-500 pt-2 w-10">#{idx + 1}</span>
                                <input type="number" value={s.weight} onChange={(e) => updateSet(idx, 'weight', e.target.value)}
                                  placeholder="Weight" className="flex-1 bg-white/5 border border-white/10 rounded px-3 py-2 text-sm text-white focus:border-neon outline-none" />
                                <input type="number" value={s.reps} onChange={(e) => updateSet(idx, 'reps', e.target.value)}
                                  placeholder="Reps" className="flex-1 bg-white/5 border border-white/10 rounded px-3 py-2 text-sm text-white focus:border-neon outline-none" />
                              </div>
                            ))}
                          </div>
                        </div>
                        <div className="flex gap-2 pt-2">
                          <button onClick={() => setShowAddExercise(false)} className="flex-1 bg-gray-700 text-white py-2 rounded-lg hover:bg-gray-600">Cancel</button>
                          <button onClick={handleAddExercise} disabled={!exerciseName || sets.every(s => !s.weight || !s.reps)}
                            className="flex-1 bg-neon text-black font-bold py-2 rounded-lg hover:scale-[1.02] transition-transform disabled:opacity-50 disabled:cursor-not-allowed">Save</button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </>
          )}

          {/* ====== HISTORY TAB ====== */}
          {activeTab === 'history' && (
            <div className="animate-fade-in space-y-4">
              <div className="space-y-2">
                <input type="text" value={historySearch} onChange={(e) => setHistorySearch(e.target.value)}
                  placeholder="Search exercise..." className="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-sm text-white focus:border-neon outline-none" />
                <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                  {['All', 'Chest', 'Back', 'Legs', 'Shoulders', 'Arms', 'Abs', 'Other'].map(part => (
                    <button key={part} onClick={() => setBodyPartFilter(part)}
                      className={`whitespace-nowrap px-3 py-1 rounded-full text-xs font-bold border transition-colors ${bodyPartFilter === part ? 'bg-neon text-black border-neon' : 'bg-transparent text-gray-400 border-gray-600 hover:border-gray-400'}`}>
                      {part}
                    </button>
                  ))}
                </div>
              </div>
              <div className="space-y-2">
                {history.length === 0 ? (
                  <div className="text-center text-gray-500 py-10">
                    <span className="material-symbols-outlined text-4xl mb-2 opacity-50">history</span>
                    <p>No history found</p>
                  </div>
                ) : history.map((log, idx) => (
                  <div key={idx} className="glass-card p-3 flex justify-between items-center">
                    <div>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="font-bold text-white">{log.exercise_name}</span>
                        {log.body_part && log.body_part !== 'Other' && (
                          <span className="text-[10px] text-gray-500 border border-gray-700 px-1 rounded">{log.body_part}</span>
                        )}
                      </div>
                      <p className="text-xs text-gray-400">{log.date}</p>
                    </div>
                    <div className="text-right">
                      <p className="font-bold text-lg text-neon">{log.weight}kg <span className="text-white text-sm">× {log.reps}</span></p>
                      <p className="text-[10px] text-gray-500">1RM: {(log.estimated_1rm || 0).toFixed(1)}kg</p>
                    </div>
                  </div>
                ))}
              </div>
              {history.length >= historyLimit && (
                <button onClick={() => setHistoryLimit(prev => prev + 20)}
                  className="w-full py-2 text-xs text-gray-500 hover:text-white transition-colors">Load More...</button>
              )}
            </div>
          )}

          {/* ====== PROGRESS TAB ====== */}
          {activeTab === 'progress' && (
            <div className="animate-fade-in space-y-4">
              <div className="glass-card p-4">
                <h3 className="font-bold text-lg mb-3 flex items-center">
                  <span className="material-symbols-outlined mr-2 text-neon">trending_up</span>
                  1RM Progress
                </h3>
                {exerciseList.length === 0 ? (
                  <p className="text-gray-500 text-center py-6">Record workouts to see your progress</p>
                ) : (
                  <>
                    <select value={selectedExercise} onChange={(e) => setSelectedExercise(e.target.value)}
                      className="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-sm text-white mb-4 outline-none"
                      style={{ backgroundColor: '#1a1a1a' }}>
                      {exerciseList.map(ex => (
                        <option key={ex.name} value={ex.name} style={{ backgroundColor: '#1a1a1a' }}>
                          {ex.name} ({ex.body_part || 'Other'})
                        </option>
                      ))}
                    </select>
                    <div style={{ height: '250px' }}>
                      <canvas ref={progressCanvasRef}></canvas>
                    </div>
                    {progressData.length > 0 && (
                      <div className="mt-4 grid grid-cols-3 gap-2 text-center">
                        <div className="bg-white/5 rounded-lg p-2">
                          <p className="text-[10px] text-gray-500">Start</p>
                          <p className="text-neon font-bold">{progressData[0].estimated_1rm.toFixed(1)}kg</p>
                        </div>
                        <div className="bg-white/5 rounded-lg p-2">
                          <p className="text-[10px] text-gray-500">Current</p>
                          <p className="text-neon font-bold">{progressData[progressData.length - 1].estimated_1rm.toFixed(1)}kg</p>
                        </div>
                        <div className="bg-white/5 rounded-lg p-2">
                          <p className="text-[10px] text-gray-500">Growth</p>
                          <p className="text-neon font-bold">
                            {progressData.length > 1
                              ? '+' + (progressData[progressData.length - 1].estimated_1rm - progressData[0].estimated_1rm).toFixed(1) + 'kg'
                              : '-'}
                          </p>
                        </div>
                      </div>
                    )}
                  </>
                )}
              </div>
            </div>
          )}

          {/* ====== AI COACH TAB ====== */}
          {activeTab === 'coach' && (
            <div className="animate-fade-in space-y-4">
              <div className="glass-card p-5 border-t-2 border-purple-500">
                <h3 className="font-bold text-lg mb-2 flex items-center">
                  <span className="material-symbols-outlined mr-2 text-purple-400">psychology</span>
                  AI Coach
                </h3>
                <p className="text-xs text-gray-400 mb-4">トレーニング履歴をAIが分析し、停滞打破のための科学的プログラムを提案します。</p>

                <div className="mb-4">
                  <label className="text-xs text-gray-500 block mb-1">Focus Exercise (optional)</label>
                  <input type="text" value={coachExercise} onChange={(e) => setCoachExercise(e.target.value)}
                    placeholder="e.g. Bench Press"
                    className="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-sm text-white focus:border-purple-400 outline-none" />
                </div>

                <button onClick={askCoach} disabled={coachLoading}
                  className="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold py-3 rounded-xl hover:scale-[1.02] transition-transform disabled:opacity-50 flex items-center justify-center">
                  {coachLoading ? (
                    <><span className="material-symbols-outlined animate-spin mr-2">progress_activity</span> Analyzing...</>
                  ) : (
                    <><span className="material-symbols-outlined mr-2">auto_awesome</span> Get AI Advice</>
                  )}
                </button>
              </div>

              {coachResult && (
                <div className="space-y-3 animate-fade-in">
                  <div className="glass-card p-4 border-l-2 border-blue-400">
                    <h4 className="font-bold text-sm text-blue-400 mb-1">📊 Analysis</h4>
                    <p className="text-sm text-gray-300">{coachResult.analysis}</p>
                  </div>
                  <div className="glass-card p-4 border-l-2 border-neon">
                    <h4 className="font-bold text-sm text-neon mb-1">💡 Advice</h4>
                    <p className="text-sm text-gray-300">{coachResult.advice}</p>
                  </div>
                  {coachResult.program && coachResult.program.length > 0 && (
                    <div className="glass-card p-4 border-l-2 border-purple-400">
                      <h4 className="font-bold text-sm text-purple-400 mb-3">📋 Suggested Program</h4>
                      <div className="space-y-2">
                        {coachResult.program.map((p, idx) => (
                          <div key={idx} className="bg-white/5 rounded-lg p-3">
                            <div className="flex justify-between items-start">
                              <span className="font-bold text-white">{p.exercise}</span>
                              <span className="text-xs text-neon">{p.sets} × {p.reps}</span>
                            </div>
                            <p className="text-xs text-gray-400 mt-1">{p.weight_guide}</p>
                            {p.note && <p className="text-xs text-purple-300 mt-1">💎 {p.note}</p>}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // 5. Notifications View
    const Notifications = () => {
      const { currentUser } = React.useContext(UserContext);
      const [notifs, setNotifs] = useState([]);

      useEffect(() => {
        const fetchNotifs = async () => {
          const res = await fetch(`/notifications?current_user=${encodeURIComponent(currentUser)}`);
          if (res.ok) setNotifs(await res.json());
        };
        fetchNotifs();
      }, [currentUser]);

      const markRead = async () => {
        await fetch(`/notifications/read?current_user=${encodeURIComponent(currentUser)}`, { method: 'POST' });
        // Optimistic update
        setNotifs(prev => prev.map(n => ({ ...n, is_read: true })));
      };

      return (
        <div className="p-4 max-w-md mx-auto animate-fade-in pb-24">
          <header className="flex justify-between items-center mb-6">
            <h2 className="text-2xl font-bold">Notifications</h2>
            <button onClick={markRead} className="text-xs text-neon border border-neon/50 px-3 py-1 rounded-full">Mark all read</button>
          </header>
          <div className="space-y-2">
            {notifs.length === 0 && <p className="text-gray-500 text-center py-10">No notifications</p>}
            {notifs.map(n => (
              <div key={n.id} className={`glass-card p-4 flex items-start space-x-3 ${!n.is_read ? 'border-l-4 border-l-neon bg-neon/5' : ''}`}>
                <span className="material-symbols-outlined text-neon mt-1">
                  {n.type === 'follow' ? 'person_add' : 'notifications'}
                </span>
                <div>
                  <p className="text-sm">
                    <span className="font-bold text-white">{n.from_user}</span>
                    {n.type === 'follow' ? ' followed you!' : ' sent a notification.'}
                  </p>
                  <p className="text-xs text-gray-500 mt-1">{new Date(n.created_at).toLocaleString()}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // 6. Friends View
    const Friends = ({ onProfileClick }) => {
      const { currentUser } = React.useContext(UserContext);
      const [search, setSearch] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [relations, setRelations] = useState({ following: [], followers: [] });
      const [feed, setFeed] = useState([]);
      const [activeSubTab, setActiveSubTab] = useState('feed'); // 'feed', 'following', 'followers', 'search'

      useEffect(() => {
        fetchRelations();
        fetchFeed();
      }, [currentUser]);

      const fetchRelations = async () => {
        const res = await fetch(`/friends?current_user=${encodeURIComponent(currentUser)}`);
        if (res.ok) setRelations(await res.json());
      };

      const fetchFeed = async () => {
        const res = await fetch(`/api/activity/feed?current_user=${encodeURIComponent(currentUser)}`);
        if (res.ok) setFeed(await res.json());
      };

      const handleSearch = async (val) => {
        setSearch(val);
        if (val.length > 1) {
          const res = await fetch(`/users/search?q=${encodeURIComponent(val)}`);
          if (res.ok) setSearchResults(await res.json());
        } else {
          setSearchResults([]);
        }
      };

      const followUser = async (name) => {
        await fetch(`/friends?current_user=${encodeURIComponent(currentUser)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ friend_username: name })
        });
        fetchRelations();
        fetchFeed();
      };

      const unfollowUser = async (name) => {
        await fetch(`/friends/${encodeURIComponent(name)}?current_user=${encodeURIComponent(currentUser)}`, {
          method: 'DELETE'
        });
        fetchRelations();
        fetchFeed();
      };

      return (
        <div className="p-4 animate-fade-in pb-24 max-w-2xl mx-auto">
          <h2 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-neon to-emerald-400 mb-6">Social</h2>

          {/* Sub-Tabs */}
          <div className="flex space-x-2 mb-6 bg-black/40 p-1 rounded-xl glass-card text-xs">
            {['feed', 'following', 'followers', 'search'].map(t => (
              <button
                key={t}
                onClick={() => setActiveSubTab(t)}
                className={`flex-1 py-2 rounded-lg transition-all capitalize ${activeSubTab === t ? 'bg-neon text-black font-bold shadow-[0_0_10px_rgba(157,255,0,0.4)]' : 'text-gray-400'}`}
              >
                {t}
              </button>
            ))}
          </div>

          {activeSubTab === 'search' && (
            <div className="space-y-4">
              <div className="relative">
                <span className="material-symbols-outlined absolute left-3 top-2.5 text-gray-500">search</span>
                <input
                  type="text"
                  placeholder="Search users..."
                  value={search}
                  onChange={(e) => handleSearch(e.target.value)}
                  className="w-full bg-black/40 border border-white/10 rounded-xl pl-10 pr-4 py-2.5 outline-none focus:border-neon transition-colors"
                />
              </div>
              <div className="space-y-2">
                {searchResults.map(u => (
                  <div key={u} className="glass-card p-4 flex items-center justify-between animate-fade-in">
                    <button onClick={() => onProfileClick(u)} className="font-bold hover:text-neon transition-colors">{u}</button>
                    {u !== currentUser && (
                      relations.following.includes(u) ?
                        <button onClick={() => unfollowUser(u)} className="text-xs bg-white/10 px-3 py-1.5 rounded-lg">Unfollow</button> :
                        <button onClick={() => followUser(u)} className="text-xs bg-neon text-black font-bold px-3 py-1.5 rounded-lg active:scale-95 transition-transform">Follow</button>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}

          {activeSubTab === 'feed' && (
            <div className="space-y-4">
              {feed.length === 0 && <p className="text-center text-gray-500 py-10">No recent activity</p>}
              {feed.map((a, i) => (
                <div key={i} className="glass-card p-4 border-l-2 border-l-neon/50 animate-fade-in">
                  <div className="flex items-center space-x-2 mb-1 text-xs">
                    <button onClick={() => onProfileClick(a.user_id)} className="font-bold text-neon hover:underline">{a.user_id}</button>
                    <span className="text-gray-500">•</span>
                    <span className="text-gray-400">{a.date}</span>
                  </div>
                  <p className="text-sm text-gray-200">
                    <span className="material-symbols-outlined text-[14px] align-middle mr-1 text-neon/70">
                      {a.type === 'workout' ? 'fitness_center' : 'restaurant'}
                    </span>
                    {a.content}
                  </p>
                </div>
              ))}
            </div>
          )}

          {(activeSubTab === 'following' || activeSubTab === 'followers') && (
            <div className="space-y-2">
              {relations[activeSubTab].length === 0 && <p className="text-center text-gray-500 py-10">No users found</p>}
              {relations[activeSubTab].map(u => (
                <div key={u} className="glass-card p-4 flex items-center justify-between animate-fade-in">
                  <button onClick={() => onProfileClick(u)} className="font-bold hover:text-neon transition-colors">
                    {u}
                    {relations.following.includes(u) && relations.followers.includes(u) &&
                      <span className="ml-2 text-[10px] bg-neon/10 text-neon px-1.5 py-0.5 rounded border border-neon/20">相互</span>
                    }
                  </button>
                  {u !== currentUser && relations.following.includes(u) && (
                    <button onClick={() => unfollowUser(u)} className="text-xs text-gray-500 hover:text-white">Unfollow</button>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    // 7. User Profile View (Limited Dashboard)
    const UserProfile = ({ username, onBack }) => {
      const { currentUser } = React.useContext(UserContext);
      const [profile, setProfile] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch(`/users/${encodeURIComponent(username)}?current_user=${encodeURIComponent(currentUser)}`)
          .then(r => r.json())
          .then(d => {
            setProfile(d);
            setLoading(false);
          });
      }, [username, currentUser]);

      if (loading) return <div className="p-20 text-center text-neon animate-pulse">Loading Profile...</div>;

      const follow = async () => {
        await fetch(`/friends?current_user=${encodeURIComponent(currentUser)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ friend_username: username })
        });
        setProfile(p => ({ ...p, is_following: true }));
      };

      const unfollow = async () => {
        await fetch(`/friends/${encodeURIComponent(username)}?current_user=${encodeURIComponent(currentUser)}`, {
          method: 'DELETE'
        });
        setProfile(p => ({ ...p, is_following: false }));
      };

      return (
        <div className="p-4 animate-fade-in pb-24 max-w-md mx-auto">
          <button onClick={onBack} className="mb-4 flex items-center text-gray-400 hover:text-white transition-colors">
            <span className="material-symbols-outlined mr-1">arrow_back</span> Back
          </button>

          <div className="glass-card p-6 mb-6 text-center">
            <div className="w-20 h-20 bg-gradient-to-br from-neon to-emerald-400 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl font-bold text-black border-4 border-white/10">
              {username[0].toUpperCase()}
            </div>
            <h2 className="text-2xl font-bold text-white mb-1">{username}</h2>
            <p className="text-xs text-gray-500 mb-4">{profile.visibility} profile</p>

            <div className="flex justify-center space-x-6 mb-6">
              <div className="text-center">
                <div className="text-xl font-bold text-neon">{profile.stats.workouts}</div>
                <div className="text-[10px] text-gray-500 uppercase tracking-wider">Workouts</div>
              </div>
              <div className="text-center">
                <div className="text-xl font-bold text-neon">{profile.stats.meals}</div>
                <div className="text-[10px] text-gray-500 uppercase tracking-wider">Meals</div>
              </div>
            </div>

            {username !== currentUser && (
              <button
                onClick={profile.is_following ? unfollow : follow}
                className={`w-full py-2.5 rounded-xl font-bold transition-all active:scale-95 ${profile.is_following ? 'bg-white/10 text-white border border-white/20' : 'bg-neon text-black shadow-[0_4px_15px_rgba(157,255,0,0.3)]'}`}
              >
                {profile.is_following ? 'Following' : 'Follow'}
              </button>
            )}
            {profile.is_follower && <p className="text-[10px] text-neon/60 mt-2 font-bold italic">Follows you</p>}
          </div>

          {profile.visibility === 'private' && (
            <div className="text-center p-8 bg-black/20 rounded-2xl border border-white/5">
              <span className="material-symbols-outlined text-4xl text-gray-600 mb-2">lock</span>
              <p className="text-sm text-gray-500">This account is private.</p>
            </div>
          )}

          {profile.visibility !== 'private' && (
            <div className="glass-card p-4">
              <h3 className="text-sm font-bold text-gray-400 mb-4 flex items-center">
                <span className="material-symbols-outlined text-sm mr-1">monitoring</span>
                Latest Activity (Coming Soon)
              </h3>
              <p className="text-xs text-gray-600 text-center py-4 italic">Individual activity display will be enabled when privacy checks for each post are added.</p>
            </div>
          )}
        </div>
      );
    };

    // 5. Settings View
    const Settings = () => {
      const { currentUser, bumpSettings } = React.useContext(UserContext);
      const [targets, setTargets] = useState({
        cal: 2000, p: 60, f: 60, c: 300, salt: 7.0, fiber: 20.0
      });

      useEffect(() => {
        fetch(`/users/me?current_user=${encodeURIComponent(currentUser)}`)
          .then(r => r.json())
          .then(d => {
            if (d.target_calories) {
              setTargets({
                cal: d.target_calories, p: d.target_protein, f: d.target_fat, c: d.target_carbs,
                salt: d.target_salt, fiber: d.target_fiber
              });
            }
          });
      }, [currentUser]);

      // PFC変更時にカロリーを自動計算 (P×4 + F×9 + C×4)
      const calcCalories = (p, f, c) => Math.round((parseFloat(p) || 0) * 4 + (parseFloat(f) || 0) * 9 + (parseFloat(c) || 0) * 4);

      const handleChange = (field, val) => {
        setTargets(prev => {
          const next = { ...prev, [field]: val };
          // PFCいずれかが変わったらカロリーを自動再計算
          if (['p', 'f', 'c'].includes(field)) {
            next.cal = calcCalories(next.p, next.f, next.c);
          }
          return next;
        });
      };

      const [saveMsg, setSaveMsg] = useState('');

      const handleSave = async () => {
        const computedCal = calcCalories(targets.p, targets.f, targets.c);
        const body = {
          target_calories: computedCal,
          target_protein: parseFloat(targets.p),
          target_fat: parseFloat(targets.f),
          target_carbs: parseFloat(targets.c),
          target_salt: parseFloat(targets.salt),
          target_fiber: parseFloat(targets.fiber)
        };
        try {
          await fetch(`/settings/targets?current_user=${encodeURIComponent(currentUser)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          setSaveMsg('✅ Saved!');
          setTimeout(() => setSaveMsg(''), 2000);
          if (bumpSettings) bumpSettings();
        } catch (e) {
          setSaveMsg('❌ Error: ' + e.message);
          setTimeout(() => setSaveMsg(''), 3000);
        }
      };

      return (
        <div className="p-4 max-w-md mx-auto animate-fade-in pb-24">
          <h2 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-neon to-emerald-400 mb-6">Settings</h2>

          <div className="glass-card p-5 space-y-4">
            <h3 className="font-bold border-b border-white/10 pb-2 mb-2">Daily Goals</h3>

            {/* カロリー（PFCから自動計算） */}
            <div className="bg-gradient-to-r from-neon/10 to-emerald-500/10 border border-neon/30 rounded-lg p-3 mb-2">
              <label className="text-xs text-neon block mb-1">Target Calories (auto-calculated)</label>
              <p className="text-2xl font-bold text-neon">{calcCalories(targets.p, targets.f, targets.c)} <span className="text-sm text-gray-400">kcal</span></p>
              <p className="text-[10px] text-gray-500 mt-1">= P({targets.p}g)×4 + F({targets.f}g)×9 + C({targets.c}g)×4</p>
            </div>

            <div className="grid grid-cols-2 gap-4">
              {[
                { l: 'Protein', f: 'p', u: 'g' },
                { l: 'Fat', f: 'f', u: 'g' },
                { l: 'Carbs', f: 'c', u: 'g' },
                { l: 'Salt', f: 'salt', u: 'g' },
                { l: 'Fiber', f: 'fiber', u: 'g' },
              ].map(t => (
                <div key={t.f}>
                  <label className="text-xs text-gray-500 block mb-1">{t.l}</label>
                  <div className="relative">
                    <input
                      type="number"
                      value={targets[t.f]}
                      onChange={(e) => handleChange(t.f, e.target.value)}
                      className="w-full bg-black/30 border border-white/10 rounded px-3 py-2 text-sm text-white focus:border-neon outline-none"
                    />
                    <span className="absolute right-3 top-2 text-xs text-gray-500">{t.u}</span>
                  </div>
                </div>
              ))}
            </div>

            <div className="pt-2">
              <button
                onClick={handleSave}
                className="w-full bg-neon text-black font-bold py-3 rounded-xl hover:scale-[1.02] transition-transform flex items-center justify-center gap-2"
              >
                <span className="material-symbols-outlined text-base">save</span>
                Update Targets
              </button>
              {saveMsg && (
                <div className="mt-2 text-center text-sm font-bold animate-bounce text-neon">
                  {saveMsg}
                </div>
              )}
            </div>
          </div>

          <div className="glass-card p-4 mt-6 opacity-50">
            <h3 className="text-sm font-bold text-gray-400 mb-2">Account Info</h3>
            <p className="text-xs text-gray-500">User ID: {currentUser}</p>
            <p className="text-xs text-gray-500">Version: React Migration v2.0</p>
          </div>
        </div>
      );
    };

    // --- Main App ---
    const App = () => {
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [showNotifs, setShowNotifs] = useState(false);
      const [profileUser, setProfileUser] = useState(null);
      const [settingsVersion, setSettingsVersion] = useState(0);
      const bumpSettings = () => setSettingsVersion(v => v + 1);
      const currentUser = localStorage.getItem('kinapp_username');

      // Render active view
      const renderContent = () => {
        if (showNotifs) return <Notifications />;
        switch (currentTab) {
          case 'dashboard': return <Dashboard setShowNotifs={setShowNotifs} />;
          case 'record': return <Record />;
          case 'workout': return <Workout />;
          case 'friends': return <Friends onProfileClick={(u) => { setProfileUser(u); setCurrentTab('profile'); }} />;
          case 'profile': return <UserProfile username={profileUser} onBack={() => setCurrentTab('friends')} />;
          case 'settings': return <Settings />;
          default: return <Dashboard setShowNotifs={setShowNotifs} />;
        }
      };

      // Pass setShowNotifs to Dashboard via Context or Props? 
      // For simplicity let's clone element or modify Dashboard props.
      // Actually modifying Dashboard definition above to accept props is cleaner.
      // But since Dashboard is defined outside, I need to update it too. 
      // Wait, I can't easily update Dashboard params in this replace. 
      // I'll update Dashboard in a separate chunk or rely on Context.

      return (
        <UserContext.Provider value={{ currentUser, setShowNotifs, settingsVersion, bumpSettings }}>
          <div className="min-h-screen text-white pb-20">
            <main>
              {/* Header override for Notifs back button */}
              {showNotifs && (
                <button onClick={() => setShowNotifs(false)} className="absolute top-4 left-4 z-50 bg-black/50 p-2 rounded-full">
                  <span className="material-symbols-outlined">arrow_back</span>
                </button>
              )}
              {renderContent()}
            </main>
            {!showNotifs && <NavBar activeTab={currentTab} setTab={setCurrentTab} />}
          </div>
        </UserContext.Provider>
      );
    };

    // Update Dashboard to receive setShowNotifs from Context
    // Redefining Dashboard here to make it work would be redundant if I don't remove the old one.
    // I will assume I can update Dashboard header in next step or use Context inside Dashboard.

    // Actually, I should just modify Dashboard to use useContext(UserContext).
    // Let's do that in a separate replace for Dashboard header.

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
